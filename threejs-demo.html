<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Three.js Demo</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #info {
      position: fixed;
      top: 16px;
      left: 16px;
      color: #fff;
      background: rgba(0,0,0,0.5);
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>
  <div id="info">
    Drag to orbit • Scroll to zoom • Right-drag to pan
  </div>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.166.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.166.0/examples/jsm/"
    }
  }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x1a1a2e);

    // Camera
    const camera = new THREE.PerspectiveCamera(
      60,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 3, 8);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const ambient = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambient);

    const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
    dirLight.position.set(5, 10, 7);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.set(2048, 2048);
    dirLight.shadow.camera.near = 1;
    dirLight.shadow.camera.far = 30;
    dirLight.shadow.camera.left = -10;
    dirLight.shadow.camera.right = 10;
    dirLight.shadow.camera.top = 10;
    dirLight.shadow.camera.bottom = -10;
    dirLight.shadow.radius = 3;
    dirLight.shadow.blurSamples = 8;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0x88aaff, 0.8);
    fillLight.position.set(-5, 5, -5);
    scene.add(fillLight);

    const rimLight = new THREE.DirectionalLight(0xffaa88, 0.5);
    rimLight.position.set(0, 5, -10);
    scene.add(rimLight);

    // Ground plane
    const groundGeo = new THREE.PlaneGeometry(50, 50);
    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x2a2a4a,
      roughness: 0.9,
      metalness: 0.1
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // Shared geometries
    const boxGeo = new THREE.BoxGeometry(1, 1, 1);
    const sphereGeo = new THREE.SphereGeometry(0.5, 32, 32);
    const cylGeo = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 32);
    const torusGeo = new THREE.TorusGeometry(0.4, 0.15, 16, 32);

    // Materials
    const materials = [
      new THREE.MeshStandardMaterial({ color: 0xe94560, roughness: 0.3, metalness: 0.7 }),
      new THREE.MeshStandardMaterial({ color: 0x00d9a5, roughness: 0.2, metalness: 0.8 }),
      new THREE.MeshStandardMaterial({ color: 0xffd600, roughness: 0.4, metalness: 0.3 }),
      new THREE.MeshStandardMaterial({ color: 0x7c4dff, roughness: 0.5, metalness: 0.6 }),
      new THREE.MeshStandardMaterial({ color: 0xff6d00, roughness: 0.3, metalness: 0.5 }),
    ];

    // Create meshes in a circle
    const meshes = [];
    const count = 12;
    const radius = 3.5;

    for (let i = 0; i < count; i++) {
      const angle = (i / count) * Math.PI * 2;
      const x = Math.cos(angle) * radius;
      const z = Math.sin(angle) * radius;

      const geo = [boxGeo, sphereGeo, cylGeo, torusGeo][i % 4];
      const mat = materials[i % materials.length];

      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, 0.75, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      mesh.userData = { baseY: 0.75, angle, radius, speed: 0.5 + Math.random() * 0.5 };
      scene.add(mesh);
      meshes.push(mesh);
    }

    // Floating center piece
    const centerGeo = new THREE.IcosahedronGeometry(0.8, 2);
    const centerMat = new THREE.MeshPhysicalMaterial({
      color: 0xffffff,
      roughness: 0.1,
      metalness: 0.9,
      clearcoat: 1,
      clearcoatRoughness: 0.1,
      transmission: 0.3,
      thickness: 0.5,
      ior: 1.5
    });
    const center = new THREE.Mesh(centerGeo, centerMat);
    center.position.set(0, 1.5, 0);
    center.castShadow = true;
    center.receiveShadow = true;
    scene.add(center);

    // Particle system (points)
    const particleCount = 500;
    const particleGeo = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const sizes = new Float32Array(particleCount);
    const colors = new Float32Array(particleCount * 3);

    for (let i = 0; i < particleCount; i++) {
      const r = 8 + Math.random() * 8;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(2 * Math.random() - 1);
      positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta) + 5;
      positions[i * 3 + 2] = r * Math.cos(phi);
      sizes[i] = 0.02 + Math.random() * 0.05;
      const color = new THREE.Color().setHSL(Math.random() * 0.1 + 0.55, 0.8, 0.6);
      colors[i * 3] = color.r;
      colors[i * 3 + 1] = color.g;
      colors[i * 3 + 2] = color.b;
    }

    particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
    particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    const particleMat = new THREE.PointsMaterial({
      size: 0.08,
      vertexColors: true,
      transparent: true,
      opacity: 0.6,
      sizeAttenuation: true,
      blending: THREE.AdditiveBlending
    });

    const particles = new THREE.Points(particleGeo, particleMat);
    scene.add(particles);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 25;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // Animation
    const clock = new THREE.Clock();

    function animate() {
      const dt = clock.getDelta();
      const t = clock.getElapsedTime();

      // Orbit meshes
      meshes.forEach((m, i) => {
        m.userData.angle += dt * m.userData.speed;
        m.position.x = Math.cos(m.userData.angle) * m.userData.radius;
        m.position.z = Math.sin(m.userData.angle) * m.userData.radius;
        m.position.y = m.userData.baseY + Math.sin(t * 2 + i) * 0.3;
        m.rotation.x += dt * 0.3;
        m.rotation.y += dt * 0.5;
      });

      // Center piece
      center.rotation.x += dt * 0.2;
      center.rotation.y += dt * 0.3;
      center.position.y = 1.5 + Math.sin(t) * 0.2;

      // Particles
      particles.rotation.y += dt * 0.02;
      const posAttr = particleGeo.attributes.position;
      for (let i = 0; i < particleCount; i++) {
        posAttr.setY(i, posAttr.getY(i) + Math.sin(t + i * 0.1) * dt * 0.05);
      }
      posAttr.needsUpdate = true;

      controls.update();
      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }

    animate();

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
