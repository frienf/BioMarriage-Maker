<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dhanalakshmi Template Preview</title>
<style>
body { margin: 0; background: #333; font-family: sans-serif; }
.container { display: flex; gap: 20px; padding: 20px; flex-wrap: wrap; }
.card { background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
.card h3 { margin: 0 0 10px; font-size: 16px; }
.card img { max-width: 350px; border: 2px solid #ccc; }
</style>
</head>
<body>
<div class="container">
  <div class="card">
    <h3>Reference Design</h3>
    <img src="../Design Template/image_3b973a6e.jpg" alt="Reference" style="max-height: 500px;">
  </div>
  <div class="card">
    <h3>Prepared Frame (Print 1240x1754)</h3>
    <img src="assets/frames/dhanalakshmi.jpg" alt="Frame" style="max-height: 500px;">
  </div>
  <div class="card">
    <h3>Preview Copy (600px)</h3>
    <img src="public/frames/dhanalakshmi.jpg" alt="Preview">
  </div>
  <div class="card">
    <h3>Sparkle Area - Before (Reference BR)</h3>
    <img src="reference/dhanalakshmi.jpg" alt="Reference BR" style="max-width: 150px; max-height: 150px; clip-path: inset(80% 10% 5% 85%);">
  </div>
  <div class="card">
    <h3>50% Overlay</h3>
    <img src="reference/overlay_50pct.jpg" alt="Overlay" style="max-width: 350px;">
  </div>

</html>
