<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="1754">
  <g stroke="#ff0000" stroke-width="1" fill="none" opacity="0.7">
    <!-- Photo opening estimate -->
    <rect x="720" y="140" width="190" height="190" stroke="#00aaff" stroke-width="2"/>
    <!-- Emblem area -->
    <rect x="500" y="30" width="250" height="160" stroke="#00aa00" stroke-width="2"/>
    <!-- Side clear zone left -->
    <rect x="70" y="400" width="120" height="900" stroke="#ffaa00" stroke-width="1"/>
    <!-- Bottom border zone -->
    <rect x="70" y="1480" width="1100" height="240" stroke="#aa00aa" stroke-width="1"/>
    <!-- Text box estimate -->
    <rect x="90" y="340" width="950" height="1020" stroke="#ff5500" stroke-width="2" stroke-dasharray="10,5"/>
  </g>
  <text x="730" y="160" font-size="16" fill="#00aaff">Photo opening</text>
  <text x="510" y="50" font-size="16" fill="#00aa00">Emblem</text>
  <text x="80" y="420" font-size="14" fill="#ffaa00">Side clear</text>
  <text x="80" y="1500" font-size="14" fill="#aa00aa">Bottom border</text>
  <text x="100" y="360" font-size="16" fill="#ff5500">Text box (A)</text>
</svg>
