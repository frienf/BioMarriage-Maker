<svg xmlns="http://www.w3.org/2000/svg" width="864" height="1232">
  <!-- Grid every 50px -->
  <g stroke="#ccc" stroke-width="0.5" opacity="0.7">
    <line x1="50" y1="0" x2="50" y2="1232"/><line x1="100" y1="0" x2="100" y2="1232"/>
    <line x1="150" y1="0" x2="150" y2="1232"/><line x1="200" y1="0" x2="200" y2="1232"/>
    <line x1="250" y1="0" x2="250" y2="1232"/><line x1="300" y1="0" x2="300" y2="1232"/>
    <line x1="350" y1="0" x2="350" y2="1232"/><line x1="400" y1="0" x2="400" y2="1232"/>
    <line x1="450" y1="0" x2="450" y2="1232"/><line x1="500" y1="0" x2="500" y2="1232"/>
    <line x1="550" y1="0" x2="550" y2="1232"/><line x1="600" y1="0" x2="600" y2="1232"/>
    <line x1="650" y1="0" x2="650" y2="1232"/><line x1="700" y1="0" x2="700" y2="1232"/>
    <line x1="750" y1="0" x2="750" y2="1232"/><line x1="800" y1="0" x2="800" y2="1232"/>
    <line x1="0" y1="50" x2="864" y2="50"/><line x1="0" y1="100" x2="864" y2="100"/>
    <line x1="0" y1="150" x2="864" y2="150"/><line x1="0" y1="200" x2="864" y2="200"/>
    <line x1="0" y1="250" x2="864" y2="250"/><line x1="0" y1="300" x2="864" y2="300"/>
    <line x1="0" y1="350" x2="864" y2="350"/><line x1="0" y1="400" x2="864" y2="400"/>
    <line x1="0" y1="450" x2="864" y2="450"/><line x1="0" y1="500" x2="864" y2="500"/>
    <line x1="0" y1="550" x2="864" y2="550"/><line x1="0" y1="600" x2="864" y2="600"/>
    <line x1="0" y1="650" x2="864" y2="650"/><line x1="0" y1="700" x2="864" y2="700"/>
    <line x1="0" y1="750" x2="864" y2="750"/><line x1="0" y1="800" x2="864" y2="800"/>
    <line x1="0" y1="850" x2="864" y2="850"/><line x1="0" y1="900" x2="864" y2="900"/>
    <line x1="0" y1="950" x2="864" y2="950"/><line x1="0" y1="1000" x2="864" y2="1000"/>
    <line x1="0" y1="1050" x2="864" y2="1050"/><line x1="0" y1="1100" x2="864" y2="1100"/>
    <line x1="0" y1="1150" x2="864" y2="1150"/><line x1="0" y1="1200" x2="864" y2="1200"/>
  </g>
  <!-- Photo opening box -->
  <rect x="580" y="120" width="160" height="160" fill="none" stroke="#00aaff" stroke-width="2"/>
  <text x="590" y="140" font-size="14" fill="#00aaff">Photo inner</text>
  <!-- Emblem -->
  <rect x="360" y="10" width="160" height="120" fill="none" stroke="#00aa00" stroke-width="2"/>
  <text x="370" y="30" font-size="14" fill="#00aa00">Emblem</text>
  <!-- Side clear zone -->
  <rect x="60" y="300" width="100" height="600" fill="none" stroke="#ffaa00" stroke-width="1"/>
  <text x="70" y="320" font-size="12" fill="#ffaa00">Side clear</text>
</svg>
